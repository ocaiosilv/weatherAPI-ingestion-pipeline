name: HourRun

on:
  schedule:
    - cron: '5,12 * * * *'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    environment: AZURE_SQL_SERVER
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repoo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Runner IP
        id: runner-ip
        run: |
          IP=$(curl -4 -s https://api.ipify.org)
          echo "Runner IP: $IP"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
        
      - name: Add Gihub IP to acess the Azure SQL Firewall 
        uses: azure/cli@v2
        with:
          inlineScript: |
            az sql server firewall-rule create \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server "${{ secrets.AZURE_SQL_SERVER }}" \
              --name "github-actions-${{ github.run_id }}" \
              --start-ip-address "${{ steps.runner-ip.outputs.ip }}" \
              --end-ip-address "${{ steps.runner-ip.outputs.ip }}"
              
      - name: Sleep 
        run: |
          timeout 10 bash -c \
            "cat < /dev/null > /dev/tcp/${{ secrets.AZURE_SQL_SERVER }}.database.windows.net/1433"
          echo "SQL Server port 1433 is reachable"
          sleep 30

      - name: Build
        run: |
          docker build -t weatherpipeline:1.0.0 .

      - name: Run
        run: |
          docker run --rm \
            -e AZURE_SQL_SERVER="${{ secrets.AZURE_SQL_SERVER }}" \
            -e AZURE_SQL_DATABASE="${{ secrets.AZURE_SQL_DATABASE }}" \
            -e AZURE_SQL_USER="${{ secrets.AZURE_SQL_USER }}" \
            -e AZURE_SQL_PASSWORD="${{ secrets.AZURE_SQL_PASSWORD }}" \
            weatherpipeline:1.0.0 
           
          
      - name: Remove GitHub Runner IP Whitelist
        if: always()
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az sql server firewall-rule delete \
              --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
              --server "${{ secrets.AZURE_SQL_SERVER }}" \
              --name "github-actions-${{ github.run_id }}" 

              
